<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surf Analyzer — 3D</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header, footer { flex: 0 0 auto; }
    /* el canvas WebGL ocupa el alto sobrante */
    #stage3d { flex: 1 1 auto; min-height: 0; position: relative; }
    #stage3d canvas { display: block; width: 100%; height: 100%; }
    #hint3d { position: absolute; top: 10px; left: 12px; color: var(--faint);
      font-size: var(--fs-xs); pointer-events: none; }
  </style>
</head>
<body>

  <nav class="topnav">
    <a class="brand" href="/"><span class="logo">🏄</span> Surf <span class="accent">Analyzer</span></a>
    <div class="tabs">
      <a class="tab" href="/dashboard"><span class="ic">👥</span> Dashboard</a>
      <a class="tab" href="/"><span class="ic">✎</span> Etiquetar</a>
      <a class="tab" href="/compare"><span class="ic">⇄</span> Comparar</a>
      <a class="tab" href="/sequence"><span class="ic">▦</span> Secuencia</a>
      <a class="tab" href="/pose3d" aria-current="page"><span class="ic">◈</span> 3D</a>
    </div>
    <span class="nav-spacer"></span>
    <span class="nav-hint">vectores del cuerpo en 3D · arrastra para orbitar, rueda para zoom</span>
  </nav>

  <header>
    <select id="videoSelect" title="elegir video"></select>
    <label title="suavizado Savitzky-Golay (quita el temblor del eje de profundidad)">
      <input type="checkbox" id="smoothToggle" checked> suavizar</label>
    <label title="interpolar los puntos ocluidos entre frames confiables (se ven translúcidos)">
      <input type="checkbox" id="fillToggle" checked> rellenar oclusiones</label>
    <span class="grow"></span>
    <span id="status"></span>
  </header>

  <div id="stage3d">
    <span id="hint3d">arrastrar = orbitar · rueda = zoom · click derecho = mover</span>
  </div>

  <footer>
    <button id="playBtn" class="play" title="reproducir / pausar (espacio)">▶ play</button>
    <button id="prevBtn" title="frame anterior (←)">◀</button>
    <input type="range" id="slider" min="0" value="0">
    <button id="nextBtn" title="frame siguiente (→)">▶</button>
    <span id="frameLabel">0 / 0</span>
  </footer>

  <script src="/static/api.js"></script>
  <script src="/static/occlusion.js"></script>
  <script type="importmap">
    { "imports": { "three": "/static/vendor/three.module.js" } }
  </script>
  <script type="module" src="/static/pose3d.js"></script>
</body>
</html>
