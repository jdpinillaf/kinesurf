<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surf Analyzer — Etiquetado</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* el video debe caber en pantalla: columna que ocupa 100vh */
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header, footer { flex: 0 0 auto; }
  </style>
</head>
<body>

  <nav class="topnav">
    <a class="brand" href="/"><span class="logo">🏄</span> Surf <span class="accent">Analyzer</span></a>
    <div class="tabs">
      <a class="tab" href="/"        aria-current="page"><span class="ic">✎</span> Etiquetar</a>
      <a class="tab" href="/compare"><span class="ic">⇄</span> Comparar</a>
      <a class="tab" href="/sequence"><span class="ic">▦</span> Secuencia</a>
    </div>
    <span class="nav-spacer"></span>
    <span class="nav-hint">corrige poses y marca ángulos sobre un video</span>
  </nav>

  <header>
    <select id="videoSelect" title="elegir video"></select>
    <label><input type="checkbox" id="skeletonToggle" checked> esqueleto</label>
    <span class="sep"></span>
    <span class="tools" role="group" aria-label="herramientas">
      <button data-tool="none" class="active" title="solo mirar">cursor</button>
      <button data-tool="landmark" title="arrastrar un punto a su sitio">corregir</button>
      <button data-tool="angle" title="medir un ángulo (3 clics)">ángulo</button>
      <button data-tool="pen" title="dibujar libre">dibujo</button>
    </span>
    <span class="grow"></span>
    <button id="undoBtn" title="deshacer último trazo">↶ undo</button>
    <button id="clearBtn" title="borrar anotaciones del frame">🗑 frame</button>
    <button id="saveBtn" class="primary" title="guardar anotaciones">guardar</button>
    <span id="status"></span>
  </header>

  <div id="stage">
    <div class="frame">
      <canvas id="base"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </div>

  <footer>
    <button id="playBtn" class="play" title="reproducir / pausar (espacio)">▶ play</button>
    <button id="prevBtn" title="frame anterior (←)">◀</button>
    <input type="range" id="slider" min="0" value="0">
    <button id="nextBtn" title="frame siguiente (→)">▶</button>
    <input type="number" id="frameInput" min="0" value="0" style="width:5em" title="ir a frame">
    <span class="strideWrap">cada <input type="number" id="strideInput" min="1" value="1" style="width:3.5em"> frames</span>
    <label class="ffWrap" title="reproducir avanzando 1 frame a la vez"><input type="checkbox" id="ffToggle"> frame a frame</label>
    <input type="number" id="ffDelay" min="50" step="50" value="300" style="width:4em" title="ms por frame en modo frame a frame">
    <span id="frameLabel">0 / 0</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
