<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KineSurf — Comparar</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Layout de comparación: todo cabe en 100vh, sin scroll de página */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    #compareHeader { display: flex; gap: var(--sp-3); align-items: center;
      padding: var(--sp-2) var(--sp-4); background: var(--surface);
      border-bottom: 1px solid var(--border); flex-wrap: wrap; flex: 0 0 auto; }
    #compareHeader .title { font-weight: 700; }
    #compareHeader .hint { color: var(--faint); font-size: var(--fs-xs); }

    /* fila de 2 columnas que ocupa el alto restante */
    #panes { flex: 1 1 auto; min-height: 0; display: flex; gap: var(--sp-3);
      padding: var(--sp-3); }
    .pane { flex: 1; min-width: 0; min-height: 0; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--sp-3);
      display: flex; flex-direction: column; box-shadow: var(--shadow-1); }
    .pane .paneTools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
      margin-bottom: var(--sp-2); flex: 0 0 auto; }
    .pane .paneTools .grow { flex: 1; }
    /* barra de clips (recorte por rango de frames) */
    .pane .clipBar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
      margin-bottom: var(--sp-2); flex: 0 0 auto; font-size: var(--fs-sm);
      padding: 6px var(--sp-2); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--r-sm); }
    .pane .clipBar .clipLabel { color: var(--faint); font-size: var(--fs-xs);
      text-transform: uppercase; letter-spacing: .4px; }
    .pane .clipBar .clipRange { color: var(--accent-2); min-width: 96px;
      font-variant-numeric: tabular-nums; }
    .pane .clipSelect { max-width: 180px; }
    /* stage ocupa el alto sobrante; el video se centra dentro */
    .pane .stage { flex: 1 1 auto; min-height: 0; display: flex;
      align-items: center; justify-content: center; overflow: hidden; }
    .pane .frame { position: relative; background: #0b1117; border-radius: var(--r);
      box-shadow: var(--shadow-2); }
    .pane .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pane .overlay { cursor: crosshair; }
    .pane .paneNav { display: flex; gap: 6px; align-items: center; margin-top: var(--sp-2);
      flex-wrap: wrap; flex: 0 0 auto; }
    .pane .slider { flex: 1; min-width: 80px; }
    .pane .strideWrap, .pane .ffWrap { display: flex; align-items: center; gap: 4px;
      font-size: var(--fs-sm); color: var(--muted); }
    .pane .frameLabel { font-size: var(--fs-sm); color: var(--muted); min-width: 64px;
      font-variant-numeric: tabular-nums; }
    .pane .status { font-size: var(--fs-sm); min-width: 60px; }
    .pane select.videoSelect { max-width: 200px; }
    .pane .playBtn { background: var(--accent); color: var(--accent-ink);
      border-color: var(--accent); }
    .pane .playBtn:hover { background: var(--accent-press); border-color: var(--accent-press); }
  </style>
</head>
<body>

  <nav class="topnav">
    <a class="brand" href="/"><img class="logo" src="/static/logo.svg" alt=""> Kine<span class="accent">Surf</span></a>
    <div class="tabs">
      <a class="tab" href="/dashboard"><span class="ic">👥</span> Dashboard</a>
      <a class="tab" href="/"><span class="ic">✎</span> Etiquetar</a>
      <a class="tab" href="/compare" aria-current="page"><span class="ic">⇄</span> Comparar</a>
      <a class="tab" href="/sequence"><span class="ic">▦</span> Secuencia</a>
      <a class="tab" href="/pose3d"><span class="ic">◈</span> 3D</a>
    </div>
    <span class="nav-spacer"></span>
    <label style="color:var(--muted)"><input type="checkbox" id="fillToggle" checked> rellenar oclusiones</label>
    <label style="color:var(--muted)"><input type="checkbox" id="metricsToggle" checked> métricas</label>
    <details class="mpick" id="metricsPick">
      <summary title="elegir qué métricas ver">métricas ▾</summary>
      <div class="mpickList"></div>
    </details>
    <label style="color:var(--muted)" title="distribución de peso (estimada por CoM) + balance"><input type="checkbox" id="balanceToggle"> peso</label>
    <label style="color:var(--muted)"><input type="checkbox" id="syncToggle"> sincronizar reproductores</label>
  </nav>

  <div id="compareHeader">
    <span class="title">Comparar 2 videos</span>
    <span class="hint">profesor vs. alumno · play/pausa y recorte independientes por panel</span>
  </div>

  <div id="panes">
    <!-- PANE A (izquierda) -->
    <div class="pane" id="paneA">
      <div class="paneTools">
        <select class="videoSelect"></select>
        <label><input type="checkbox" class="skeletonToggle" checked> esqueleto</label>
        <span class="sep"></span>
        <span class="tools" role="group" aria-label="herramientas">
          <button data-tool="none" class="active">cursor</button>
          <button data-tool="landmark">corregir</button>
          <button data-tool="angle">ángulo</button>
          <button data-tool="pen">dibujo</button>
          <button data-tool="arrow" title="flecha (arrastrar)">flecha</button>
          <button data-tool="text" title="texto (clic y escribir)">texto</button>
        </span>
        <span class="grow"></span>
        <button class="undoBtn" title="deshacer">↶</button>
        <button class="clearBtn" title="borrar frame">🗑</button>
        <button class="saveBtn" title="guardar">guardar</button>
        <span class="status"></span>
      </div>
      <div class="clipBar">
        <span class="clipLabel">clip</span>
        <select class="clipSelect"><option value="">video completo</option></select>
        <button class="markInBtn" title="marcar inicio en frame actual">[ inicio</button>
        <button class="markOutBtn" title="marcar fin en frame actual">fin ]</button>
        <span class="clipRange">—</span>
        <input class="clipNameInput" placeholder="nombre clip" style="width:8em">
        <button class="saveClipBtn">+ clip</button>
      </div>
      <div class="stage">
        <div class="frame">
          <canvas class="base"></canvas>
          <canvas class="overlay"></canvas>
        </div>
      </div>
      <div class="paneNav">
        <button class="playBtn" title="reproducir / pausar">▶ play</button>
        <button class="prevBtn" title="frame anterior">◀</button>
        <input type="range" class="slider" min="0" value="0">
        <button class="nextBtn" title="frame siguiente">▶</button>
        <input type="number" class="frameInput" min="0" value="0" style="width:5em">
        <span class="strideWrap">cada <input type="number" class="strideInput" min="1" value="1" style="width:3.5em"> frames</span>
        <label class="ffWrap" title="reproducir avanzando 1 frame a la vez"><input type="checkbox" class="ffToggle"> frame a frame</label>
        <input type="number" class="ffDelay" min="50" step="50" value="300" style="width:4em" title="ms por frame en modo frame a frame">
        <span class="frameLabel">0 / 0</span>
      </div>
      <div class="metricsPanel"></div>
    </div>

    <!-- PANE B (derecha) -->
    <div class="pane" id="paneB">
      <div class="paneTools">
        <select class="videoSelect"></select>
        <label><input type="checkbox" class="skeletonToggle" checked> esqueleto</label>
        <span class="sep"></span>
        <span class="tools" role="group" aria-label="herramientas">
          <button data-tool="none" class="active">cursor</button>
          <button data-tool="landmark">corregir</button>
          <button data-tool="angle">ángulo</button>
          <button data-tool="pen">dibujo</button>
          <button data-tool="arrow" title="flecha (arrastrar)">flecha</button>
          <button data-tool="text" title="texto (clic y escribir)">texto</button>
        </span>
        <span class="grow"></span>
        <button class="undoBtn" title="deshacer">↶</button>
        <button class="clearBtn" title="borrar frame">🗑</button>
        <button class="saveBtn" title="guardar">guardar</button>
        <span class="status"></span>
      </div>
      <div class="clipBar">
        <span class="clipLabel">clip</span>
        <select class="clipSelect"><option value="">video completo</option></select>
        <button class="markInBtn" title="marcar inicio en frame actual">[ inicio</button>
        <button class="markOutBtn" title="marcar fin en frame actual">fin ]</button>
        <span class="clipRange">—</span>
        <input class="clipNameInput" placeholder="nombre clip" style="width:8em">
        <button class="saveClipBtn">+ clip</button>
      </div>
      <div class="stage">
        <div class="frame">
          <canvas class="base"></canvas>
          <canvas class="overlay"></canvas>
        </div>
      </div>
      <div class="paneNav">
        <button class="playBtn" title="reproducir / pausar">▶ play</button>
        <button class="prevBtn" title="frame anterior">◀</button>
        <input type="range" class="slider" min="0" value="0">
        <button class="nextBtn" title="frame siguiente">▶</button>
        <input type="number" class="frameInput" min="0" value="0" style="width:5em">
        <span class="strideWrap">cada <input type="number" class="strideInput" min="1" value="1" style="width:3.5em"> frames</span>
        <label class="ffWrap" title="reproducir avanzando 1 frame a la vez"><input type="checkbox" class="ffToggle"> frame a frame</label>
        <input type="number" class="ffDelay" min="50" step="50" value="300" style="width:4em" title="ms por frame en modo frame a frame">
        <span class="frameLabel">0 / 0</span>
      </div>
      <div class="metricsPanel"></div>
    </div>
  </div>

  <div id="deltaBar"></div>

  <script src="/static/api.js"></script>
  <script src="/static/draw.js"></script>
  <script src="/static/metrics.js"></script>
  <script src="/static/occlusion.js"></script>
  <script src="/static/pane.js"></script>
  <script src="/static/compare.js"></script>
</body>
</html>
