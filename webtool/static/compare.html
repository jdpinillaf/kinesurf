<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surf — Comparar 2 videos</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Layout de comparación: todo cabe en 100vh, sin scroll de página */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #compareHeader { display: flex; gap: 12px; align-items: center; padding: 8px 12px;
      background: #2a2a32; flex-wrap: wrap; flex: 0 0 auto; }
    #compareHeader .title { font-weight: 600; }
    #compareHeader a { color: #8ab4f8; }
    /* fila de 2 columnas que ocupa el alto restante */
    #panes { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; padding: 10px; }
    .pane { flex: 1; min-width: 0; min-height: 0; background: #242430;
      border: 1px solid #3a3a44; border-radius: 8px; padding: 8px;
      display: flex; flex-direction: column; }
    .pane .paneTools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
      margin-bottom: 8px; flex: 0 0 auto; }
    .pane .paneTools .tools { display: flex; gap: 4px; }
    /* stage ocupa el alto sobrante; el video se centra y escala a ese alto */
    .pane .stage { flex: 1 1 auto; min-height: 0; display: flex;
      align-items: center; justify-content: center; overflow: hidden; }
    /* .frame: caja con la proporción del video; alto = 100% del stage, ancho derivado,
       y nunca más ancho que la columna (max-width) → comportamiento "contain". */
    .pane .frame { position: relative; height: 100%; max-width: 100%;
      aspect-ratio: var(--ar, 0.5625); background: #15151b; border-radius: 4px; }
    .pane .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pane .overlay { cursor: crosshair; }
    .pane .paneNav { display: flex; gap: 6px; align-items: center; margin-top: 8px;
      flex-wrap: wrap; flex: 0 0 auto; }
    .pane .slider { flex: 1; min-width: 80px; }
    .pane .strideWrap { display: flex; align-items: center; gap: 4px; font-size: 13px;
      color: #aab; }
    .pane .frameLabel { font-size: 13px; color: #aab; min-width: 64px; }
    .pane .status { font-size: 13px; color: #8c8; min-width: 60px; }
    .pane select.videoSelect { max-width: 200px; }
  </style>
</head>
<body>

  <div id="compareHeader">
    <span class="title">Comparar 2 videos</span>
    <label><input type="checkbox" id="syncToggle"> sincronizar reproductores</label>
    <span style="margin-left:auto"><a href="/">← volver al etiquetado</a></span>
  </div>

  <div id="panes">
    <!-- PANE A (izquierda) -->
    <div class="pane" id="paneA">
      <div class="paneTools">
        <select class="videoSelect"></select>
        <label><input type="checkbox" class="skeletonToggle" checked> esqueleto</label>
        <span class="tools">
          <button data-tool="none" class="active">cursor</button>
          <button data-tool="landmark">corregir</button>
          <button data-tool="angle">ángulo</button>
          <button data-tool="pen">dibujo</button>
        </span>
        <button class="undoBtn">undo</button>
        <button class="clearBtn">clear</button>
        <button class="saveBtn">guardar</button>
        <span class="status"></span>
      </div>
      <div class="stage">
        <div class="frame">
          <canvas class="base"></canvas>
          <canvas class="overlay"></canvas>
        </div>
      </div>
      <div class="paneNav">
        <button class="playBtn">▶</button>
        <button class="prevBtn">◀</button>
        <input type="range" class="slider" min="0" value="0">
        <button class="nextBtn">▶|</button>
        <input type="number" class="frameInput" min="0" value="0" style="width:5em">
        <span class="strideWrap">cada <input type="number" class="strideInput" min="1" value="1" style="width:3.5em"> frames</span>
        <span class="frameLabel">0 / 0</span>
      </div>
    </div>

    <!-- PANE B (derecha) -->
    <div class="pane" id="paneB">
      <div class="paneTools">
        <select class="videoSelect"></select>
        <label><input type="checkbox" class="skeletonToggle" checked> esqueleto</label>
        <span class="tools">
          <button data-tool="none" class="active">cursor</button>
          <button data-tool="landmark">corregir</button>
          <button data-tool="angle">ángulo</button>
          <button data-tool="pen">dibujo</button>
        </span>
        <button class="undoBtn">undo</button>
        <button class="clearBtn">clear</button>
        <button class="saveBtn">guardar</button>
        <span class="status"></span>
      </div>
      <div class="stage">
        <div class="frame">
          <canvas class="base"></canvas>
          <canvas class="overlay"></canvas>
        </div>
      </div>
      <div class="paneNav">
        <button class="playBtn">▶</button>
        <button class="prevBtn">◀</button>
        <input type="range" class="slider" min="0" value="0">
        <button class="nextBtn">▶|</button>
        <input type="number" class="frameInput" min="0" value="0" style="width:5em">
        <span class="strideWrap">cada <input type="number" class="strideInput" min="1" value="1" style="width:3.5em"> frames</span>
        <span class="frameLabel">0 / 0</span>
      </div>
    </div>
  </div>

  <script src="/static/pane.js"></script>
  <script src="/static/compare.js"></script>
</body>
</html>
